<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J (Jiyay) — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      font-family: 'Orbitron', sans-serif;
      color: #fff;
    }
    header {
      position: relative;
      height: 100vh;
      background: radial-gradient(circle at center, #1a1a1a 0%, #0f0f0f 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .bg-gif-container {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 350px;
      height: 350px;
      transform: translate(-50%, -50%);
      opacity: 0.3;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 60px #0ff;
      z-index: 1;
    }
    .bg-gif-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .name-stack {
      z-index: 2;
      font-size: 10em;
      font-weight: 700;
      letter-spacing: 8px;
      text-shadow: 0 0 25px #0ff, 0 0 50px #0ff;
    }
    .social-icons {
      z-index: 2;
      margin-top: 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
    }
    .social-icons a {
      width: 45px;
      height: 45px;
      transition: transform 0.3s ease, filter 0.3s ease;
    }
    .social-icons a:hover {
      transform: scale(1.3);
      filter: drop-shadow(0 0 10px #0ff);
    }
    .social-icons img {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="bg-gif-container">
      <img src="slowed_naruto.gif" alt="Naruto GIF">
    </div>
    <div class="name-stack">J</div>
    <div class="social-icons">
      <a href="https://youtube.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube"></a>
      <a href="https://kick.com" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Kick.com_logo.svg/512px-Kick.com_logo.svg.png" alt="Kick"></a>
      <a href="https://instagram.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram"></a>
      <a href="https://tiktok.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046125.png" alt="TikTok"></a>
      <a href="https://discord.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" alt="Discord"></a>
      <a href="https://ko-fi.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968569.png" alt="Ko-Fi"></a>
      <a href="https://paypal.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/888/888870.png" alt="PayPal"></a>
      <a href="https://amazon.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/888/888879.png" alt="Amazon"></a>
      <a href="https://twitch.tv" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/733/733641.png" alt="Twitch"></a>
    </div>
  </header>
</body>
</html>
