<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>J (Jiyay) — Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Orbitron', sans-serif;
      background: #0f0f0f;
      color: #fff;
      overflow-x: hidden;
    }
    header {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0f0f0f;
      overflow: hidden;
    }
    .bg-gif {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.5; /* make it clearly visible */
      z-index: 1;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4); /* dark layer so text/icons pop */
      z-index: 2;
    }
    .name-stack {
      font-size: 10em;
      font-weight: 700;
      letter-spacing: 8px;
      z-index: 3;
      text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
    }
    .social-icons {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      justify-content: center;
      z-index: 3;
    }
    .social-icons a {
      width: 40px;
      height: 40px;
      transition: transform 0.3s ease, filter 0.3s ease;
    }
    .social-icons a:hover {
      transform: scale(1.3);
      filter: drop-shadow(0 0 8px #0ff);
    }
    .social-icons img {
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <header>
    <img src="slowed_naruto.gif" alt="Naruto" class="bg-gif">
    <div class="overlay"></div>
    <div class="name-stack">J</div>
    <div class="social-icons">
      <a href="https://youtube.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YouTube"></a>
      <a href="https://kick.com" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Kick.com_logo.svg/512px-Kick.com_logo.svg.png" alt="Kick"></a>
      <a href="https://instagram.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram"></a>
      <a href="https://tiktok.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046125.png" alt="TikTok"></a>
      <a href="https://discord.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" alt="Discord"></a>
      <a href="https://ko-fi.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968569.png" alt="Ko-Fi"></a>
      <a href="https://paypal.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/888/888870.png" alt="PayPal"></a>
      <a href="https://amazon.com" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/888/888879.png" alt="Amazon"></a>
      <a href="https://twitch.tv" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/733/733641.png" alt="Twitch"></a>
    </div>
  </header>
</body>
</html>
